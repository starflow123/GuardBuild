name: Self-Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  drill:
    name: 端到端演练（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 Python（FastAPI 演练）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 FastAPI 运行时依赖
        run: python -m pip install --quiet fastapi uvicorn

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux TLS 依赖（native-tls/openssl）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cargo 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 构建无头宿主（无 GUI / WebKit 依赖）
        working-directory: src-tauri
        run: cargo build --no-default-features --bin guardbuild-headless

      - name: Sidecar 单元测试
        run: node --test "sidecar/tests/**/*.test.mjs"

      - name: gate 演练（多轮终态裁决 + 报告产物 + 退出码一致）
        run: node scripts/e2e-gate.mjs

      - name: 主工作流 E2E（回环全流程 + 登录/越权/修复复验）
        run: node scripts/e2e-headless.mjs

      - name: Supabase 适配器 E2E（RLS 探测 + 密钥暴露，本机 mock）
        run: node scripts/e2e-supabase.mjs

      - name: Next.js 适配器 E2E（App Router 解析 + 越权复现，本机垫片）
        run: node scripts/e2e-next.mjs

      - name: NestJS 适配器 E2E（装饰器路由解析 + 越权/穿越复现，本机垫片）
        run: node scripts/e2e-nest.mjs

      - name: SSRF E2E（本机 canary 回连取证 + 主机白名单对照）
        run: node scripts/e2e-ssrf.mjs

      - name: 文件上传 E2E（主动内容同源回读取证 + 类型白名单对照）
        run: node scripts/e2e-upload.mjs

      - name: JWT 伪造令牌 E2E（alg=none / 无效签名伪造 + 固定算法强密钥对照）
        run: node scripts/e2e-jwt.mjs

      - name: 业务逻辑/竞态 E2E（状态跳步回读 + 并发双花，加固后 409/单次成功对照）
        run: node scripts/e2e-bizlogic.mjs

      - name: tRPC 适配器 E2E（过程路径组装 + input 编码协商，本机垫片）
        run: node scripts/e2e-trpc.mjs

      - name: GraphQL 适配器 E2E（SDL 字段级越权 + 两种拒绝语义流派 + 内省降级）
        run: node scripts/e2e-graphql.mjs

      - name: 契约扩展 E2E（静态看不见的路由 + responses/listEndpoint/多参数绑定 + inconclusive 终态）
        run: node scripts/e2e-contract.mjs

      - name: 资源契约自动发现 E2E（零人工契约 + 多段路径运行期绑定 + 不猜终态）
        run: node scripts/e2e-shape.mjs

      - name: Python 适配器 E2E（FastAPI 真实 uvicorn + 越权/匿名/修复三分支）
        run: node scripts/e2e-python.mjs

      - name: SSR 页面越权 E2E（全站只有 HTML：页面链接发现 + 正文归属取证 + 跨文件加固对照）
        run: node scripts/e2e-ssr.mjs

      - name: 身份与数据自举 E2E（空库靶场：引擎注册建号 + seed 造数据 + 口令不落产物 + 四类测不了终态）
        run: node scripts/e2e-selfboot.mjs

      - name: 自举换场景 E2E（非标准注册形态：兜底代理提议 + 引擎实跑采纳 + 观测种子 + 已验证缓存复用）
        run: node scripts/e2e-selfboot-odd.mjs

      - name: 黑盒外部模式 E2E（真实 HTTP 目标 + Cookie 会话鉴权，本机回环）
        run: node scripts/e2e-blackbox.mjs

      - name: 攻击规划代理 E2E（本机 mock DeepSeek：预算重排 + 只认编号 + gate 结构性禁用）
        run: node scripts/e2e-attackplan.mjs

      - name: 探索区自主试打 E2E（本机 mock：引擎实发 + 预算超限即停 + 草稿不进判定链 + gate/黑盒不进入）
        run: node scripts/e2e-explore.mjs

      - name: LLM 侦察 E2E（本机 mock DeepSeek + 磁盘缓存复用，无需真实密钥）
        run: node scripts/e2e-llm-scout.mjs

      - name: LLM 编码代理补丁 E2E（本机 mock：意图校验 + 自动双重验收 + 无密钥回落）
        run: node scripts/e2e-llm-patch.mjs

      - name: Fix agent 自纠错 E2E（两轮：失败证据回传 + 重生成补丁）
        run: node scripts/e2e-fix-agent.mjs

      - name: S2-full 跨文件/新建文件写权限 E2E（本机 mock：依赖闭包授权集 + 双重验收 + 越界拒绝）
        run: node scripts/e2e-cross-file.mjs

      - name: S3-full 有界启动代理 E2E（本机 mock：引擎拼装菜单 + 抗命拒绝 + gate 结构性禁用）
        run: node scripts/e2e-bootstrap.mjs

      - name: 分发布局 E2E（随包 node 在 PATH 无 node 时跑通 gate）
        run: node scripts/e2e-package.mjs

      - name: 精度基准（14 个标注靶场：漏报 / 误报 / 退出码一致性）
        run: node scripts/benchmark.mjs

      - name: 黑盒精度基准（25 个标注靶场：用例族召回 / 误报 / 写与破坏性探测开关 / 路由发现来源 / 退出码）
        run: node scripts/benchmark-blackbox.mjs

      - name: Docker 沙箱 E2E（无可用 Docker 时自动跳过）
        run: node scripts/e2e-docker.mjs

      - name: 前端依赖安装与构建（tsc + vite）
        run: |
          npm ci
          npm run build

      - name: 上传报告与证据库
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardbuild-artifacts-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .demo-gate/reports
            .demo-gate/data/guardbuild.db
            .demo/data/guardbuild.db
            .demo-supabase/reports
            .demo-supabase/data/guardbuild.db
            .demo-next/reports
            .demo-next/data/guardbuild.db
            .demo-nest/reports
            .demo-nest/data/guardbuild.db
            .demo-ssrf/reports
            .demo-ssrf/data/guardbuild.db
            .demo-upload/reports
            .demo-upload/data/guardbuild.db
            .demo-jwt/reports
            .demo-jwt/data/guardbuild.db
            .demo-bizlogic/reports
            .demo-bizlogic/data/guardbuild.db
            .demo-trpc/reports
            .demo-trpc/data/guardbuild.db
            .demo-graphql/reports
            .demo-graphql/data/guardbuild.db
            .demo-python/reports
            .demo-python/data/guardbuild.db
            .demo-blackbox-e2e/reports
            .demo-blackbox-e2e/data/guardbuild.db
            .demo-llm/reports
            .demo-llm/data/guardbuild.db
            .demo-llm-patch/reports
            .demo-llm-patch/data/guardbuild.db
            .demo-cross-file/reports
            .demo-cross-file/data/guardbuild.db
            .demo-bootstrap/reports
            .demo-bootstrap/data/guardbuild.db
            .demo-docker-e2e/reports
            .demo-docker-e2e/data/guardbuild.db
            .benchmark/benchmark-report.md
            .benchmark/benchmark-report.json
            .benchmark/reports
