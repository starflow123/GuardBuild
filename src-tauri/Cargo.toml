[package]
name = "guardbuild"
version = "0.1.0"
description = "GuardBuild 桌面安全 Agent - Rust Host"
edition = "2021"
default-run = "guardbuild"

[lib]
name = "guardbuild_lib"
crate-type = ["rlib"]

[[bin]]
name = "guardbuild"
path = "src/main.rs"

[[bin]]
name = "guardbuild-headless"
path = "src/bin/headless.rs"

[features]
# 默认启用 GUI（Tauri 桌面壳）；CI/无头构建使用 --no-default-features，
# 此时不编译 tauri/rfd，可在无 WebKit 依赖的 Linux 环境构建 guardbuild-headless。
default = ["gui"]
gui = ["dep:tauri", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
native-tls = "0.2"
rfd = { version = "0.15", optional = true }
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
